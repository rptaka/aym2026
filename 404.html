<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AYM-LIVE</title>
    <script type="text/javascript">
      // Redirect to hash-based routing for single page app
      var l = window.location;
      if (l.pathname !== '/' && !l.pathname.includes('.')) {
        l.replace(
          l.protocol + '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          '/aym2026/#' +
          l.pathname +
          l.search +
          l.hash
        );
      }
    </script>
  </head>
  <body></body>
</html>
